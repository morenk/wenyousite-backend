name: quality

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
      DIRECT_DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm check

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
      DIRECT_DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
      DIRECT_DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm test:coverage

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: wenyou
          POSTGRES_PASSWORD: wenyou_test
          POSTGRES_DB: wenyousite_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wenyou -d wenyousite_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wenyou:wenyou_test@127.0.0.1:5432/wenyousite_replay
      DIRECT_DATABASE_URL: postgresql://wenyou:wenyou_test@127.0.0.1:5432/wenyousite_replay
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma migrate status
      - run: pnpm test:data-security:integration
      - run: pnpm build
      - run: pnpm test:e2e:auth-terminal
      - run: pnpm test:e2e:economy-terminal
      - run: pnpm test:e2e
