name: quality

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
      DIRECT_DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: python3 scripts/prepare-audio-runtime.py
      - run: pnpm check

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
      DIRECT_DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
      DIRECT_DATABASE_URL: postgresql://ci:ci@example.invalid/wenyousite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: python3 scripts/prepare-audio-runtime.py
      - run: pnpm test:coverage

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: wenyou
          POSTGRES_PASSWORD: wenyou_test
          POSTGRES_DB: wenyousite_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wenyou -d wenyousite_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wenyou:wenyou_test@127.0.0.1:5432/wenyousite_replay
      DIRECT_DATABASE_URL: postgresql://wenyou:wenyou_test@127.0.0.1:5432/wenyousite_replay
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: python3 scripts/prepare-audio-runtime.py
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma migrate status
      - run: pnpm test:data-security:integration
      - run: pnpm build
      - name: Prepare isolated PostgreSQL and Redis binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 redis-server bubblewrap python3.12 apparmor
          pg_bin=/usr/lib/postgresql/16/bin
          redis_bin=$(command -v redis-server)
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/postgres"
          test -x "$redis_bin"
          printf 'E2E_PG_BIN=%s\nE2E_REDIS_BIN=%s\n' "$pg_bin" "$redis_bin" >> "$GITHUB_ENV"
      - name: Enable the Ubuntu bubblewrap namespace profile
        run: |
          # 优先使用发行版 profile；部分 runner 的 apparmor 包尚未包含该文件。
          if test -r /etc/apparmor.d/bwrap-userns-restrict; then
            sudo apparmor_parser --replace /etc/apparmor.d/bwrap-userns-restrict
          else
            sudo install -m 0644 scripts/fonts/dynamic/ci-bwrap.apparmor /etc/apparmor.d/wenyou-font-ci-bwrap
            sudo apparmor_parser --replace /etc/apparmor.d/wenyou-font-ci-bwrap
          fi
      - name: Verify unprivileged font sandbox prerequisites
        run: |
          test "$(id -u)" -ne 0
          test -x /usr/bin/prlimit
          test -x /usr/bin/python3.12
          # 固定只读探针不加载字体、连接应用或读取凭据；完整边界验证仍由隔离 E2E 执行。
          /usr/bin/bwrap --unshare-net --unshare-pid --unshare-ipc --unshare-uts \
            --die-with-parent --new-session --cap-drop ALL --clearenv \
            --ro-bind /usr /usr --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --remount-ro /proc --remount-ro /dev --remount-ro / \
            /usr/bin/python3.12 -I -B -c \
            'import os; assert os.getuid() != 0; assert "NoNewPrivs:\t1" in open("/proc/self/status").read(); print("font-sandbox-prerequisites: passed")'
      - run: pnpm text-font:prepare-toolchain
      - name: Verify font sandbox under the production systemd restrictions
        run: |
          sudo groupadd --system wenyousite-runtime
          sudo useradd --system --no-create-home --user-group wenyousite-backend
          sudo install -d -m 0755 /var/lib/wenyousite
          probe_repo=$(sudo mktemp -d /var/lib/wenyousite/font-ci-XXXXXX)
          trap 'sudo rm -rf --one-file-system -- "$probe_repo"' EXIT
          sudo chmod 0755 "$probe_repo"
          sudo cp -a dist node_modules scripts ops "$probe_repo/"
          sudo install -d -m 0755 "$probe_repo/.cache"
          sudo cp -a .cache/thread-font-toolchain "$probe_repo/.cache/"
          # ProtectHome 保持开启；只复制探针依赖，不传入应用环境或用户字体。
          sudo env -i PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" \
            bash "$probe_repo/scripts/font-sandbox-preflight.integration.test.sh"
      - run: echo "TEXT_FONT_TOOLCHAIN_DIR=$GITHUB_WORKSPACE/.cache/thread-font-toolchain" >> "$GITHUB_ENV"
      - run: pnpm test:integration:font-formats
      - run: pnpm test:e2e:full
      - run: pnpm test:integration:audio-budget
      - run: pnpm test:e2e
