name: wenyousite

# 公网开发环境的唯一基础设施编排。
# Caddy、NestJS 和 Next.js 由宿主机进程管理；Compose 只管理有状态依赖。
services:
  postgres:
    image: postgres:17-alpine
    container_name: wenyousite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wenyou
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wenyou}
      POSTGRES_DB: wenyousite
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenyou -d wenyousite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wenyousite-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 仅用于 loadtest profile；与正式 PostgreSQL/Redis 使用独立容器、端口和数据卷。
  loadtest-postgres:
    image: postgres:17-alpine
    container_name: wenyousite-loadtest-postgres
    profiles: ["loadtest"]
    environment:
      POSTGRES_USER: wenyou_loadtest
      # loadtest profile 启动时应由 target.env 覆盖；默认值仅让 Compose 门禁可解析。
      POSTGRES_PASSWORD: ${LOADTEST_DB_PASSWORD:-loadtest-profile-placeholder-do-not-use}
      POSTGRES_DB: wenyousite_loadtest
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - loadtest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenyou_loadtest -d wenyousite_loadtest"]
      interval: 5s
      timeout: 5s
      retries: 20

  loadtest-redis:
    image: redis:7-alpine
    container_name: wenyousite-loadtest-redis
    profiles: ["loadtest"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - loadtest_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
    name: wenyousite_pgdata
  redisdata:
    name: wenyousite_redisdata
  loadtest_pgdata:
    name: wenyousite_loadtest_pgdata
  loadtest_redisdata:
    name: wenyousite_loadtest_redisdata
