services:
  postgres:
    image: postgres:17-alpine
    container_name: wenyousite-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wenyou
      POSTGRES_PASSWORD: wenyou
      POSTGRES_DB: wenyousite
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenyou -d wenyousite"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wenyousite-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
